# IETF Hackathon

## OpenNHP

IETF 126

18-19 July 2026

Vienna, Austria


---

# AI attacks are outpacing defenders

**Problem:** AI models such as [Claude Mythos](https://www.anthropic.com/claude/mythos) can automate cyberattacks at machine speed, leaving defenders less time to detect, respond, and patch.

**The connect-first model is broken for the AI era:**

 - Services are exposed before users are authenticated
 - Visibility enables scanning, probing, and attack
 - The Internet becomes a “dark forest,” where visibility creates vulnerability (*The Three-Body Problem*)

**A new model: authenticate before connect**

 - **NHP:** Network-infrastructure Hiding Protocol
 - *OSI Layer 5* cryptography verifies and authorizes the requester before connection
 - Protected resources stay hidden until access is approved

**Hackathon goal:** Test whether NHP reduces the pre-authentication attack surface.

<div class="my-footer"><p>IETF Hackathon - OpenNHP</p></div>

# What we are testing

**OpenNHP is the open-source reference implementation of the NHP protocol.**

Project links: [OpenNHP website](https://opennhp.org/) · [GitHub](https://github.com/OpenNHP/opennhp) · [IETF 126 Hackathon wiki](https://wiki.ietf.org/en/meeting/126/hackathon#opennhp-network-infrastructure-hiding-protocol-nhp) · [NHP Internet-Draft](https://datatracker.ietf.org/doc/html/draft-opennhp-ztcpp-nhp)

**Default-deny visibility**

 - An unauthenticated scan should not discover the protected service
 - A malformed or forged knock should not create an access path

**Authentication and freshness**

 - Replayed or stale requests should be rejected
 - A valid requester should reach only the authorized resource

**Access lifecycle**

 - The temporary path should close after its configured TTL
 - Revocation should restore the deny-all state predictably
